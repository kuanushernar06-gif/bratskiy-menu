  function getCart() { return state.cart; }

    c[key] = (c[key] || 0) + 1;
    state.cart = c;
    render();
  }
  function decKey(key) {
    var c = Object.assign({}, state.cart);
    if (c[key]) {
      c[key] = c[key] - 1;
      if (c[key] <= 0) delete c[key];
    }
    state.cart = c;
    render();
  }

  function render() {
    var allEntries = [];
    var mkEntries = {};

    function mk(key, name, price) {
      var qty = qtyOf(key);
      var e = { key: key, name: name, price: price, qty: qty, priceText: fmtPrice(price) };
      allEntries.push(e);
      return e;
    }

    var categories = categoriesRaw.map(function (c) {
      return {
        id: c.id,
        title: state.lang === 'ru' ? c.ruTitle : c.title,
        icon: c.icon,
        items: c.items.map(function (it, idx) {
          var key = 'c_' + c.id + '_' + idx;
          return mk(key, T(it[0], it[1]), it[2]);
        })
      };
    });

    var navItemsData = categoriesRaw.map(function (c) {
      return { id: c.id, title: state.lang === 'ru' ? c.ruTitle : c.title };
    }).concat([
      { id: 'sets', title: T('Сеттер', 'Сеты') },
      { id: 'address', title: T('Мекен-жай', 'Адрес') }
    ]);

    var sauces = saucesRaw.map(function (pair, idx) {
      var key = 'sa_' + idx;
      var on = !!state.sauceSel[key];
      return { key: key, text: T(pair[0], pair[1]), on: on };
    });
    var selectedSauceNames = sauces.filter(function (s) { return s.on; }).map(function (s) { return s.text; });

    var rules = rulesRaw.map(function (pair) { return T(pair[0], pair[1]); });

    var sets = setsRaw.map(function (row, idx) {
      var key = 's_' + idx;
      var base = mk(key, T(row[0][0], row[0][1]), row[1]);
      base.items = row[2].map(function (pair) { return T(pair[0], pair[1]); });
      return base;
    });

    var miniSets = miniSetsRaw.map(function (row, idx) {
      var key = 'm_' + idx;
      var base = mk(key, row[0], row[1]);
      base.items = row[2].map(function (pair) { return T(pair[0], pair[1]); });
      return base;
    });

    var chosen = allEntries.filter(function (e) { return e.qty > 0; });
    var totalQty = chosen.reduce(function (s, e) { return s + e.qty; }, 0) + selectedSauceNames.length;
    var totalPrice = chosen.reduce(function (s, e) { return s + e.qty * e.price; }, 0);
    var hasItems = chosen.length > 0 || selectedSauceNames.length > 0;

    var deliveryChosenLabel = state.deliveryType === 'delivery' ? T('Жеткізу', 'Доставка') : T('Барып алу', 'Самовывоз');
    var chosenItemsList = chosen.map(function (e) { return e.name + ' — ' + e.qty + ' × ' + e.priceText; })
      .concat(selectedSauceNames);

    var orderLines = chosen.map(function (e) { return e.name + ' — ' + e.qty + ' x ' + fmtPrice(e.price) + ' = ' + fmtPrice(e.qty * e.price); }).join('\n');
    var sauceLine = selectedSauceNames.length ? T('\n\nСоустар: ', '\n\nСоусы: ') + selectedSauceNames.join(', ') : '';
    var deliveryLine = T('\n\nАлу тәсілі: ', '\n\nСпособ получения: ') + deliveryChosenLabel;
    var messageText = T('Тапсырыс — Bratskiy Shashlyk\n\n', 'Заказ — Bratskiy Shashlyk\n\n') + orderLines + sauceLine + deliveryLine + T('\n\nЖалпы сома: ', '\n\nИтого: ') + fmtPrice(totalPrice);
    var orderLink = 'https://wa.me/' + WHATSAPP_PHONE + '?text=' + encodeURIComponent(messageText);

    var html = '';

    // Header
    html += '<header style="text-align:center; padding:52px 20px 26px">';
    html += '<div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px">';
    html += '<button type="button" data-action="setLang" data-lang="kk" class="nav-pill" style="' + langPillStyle('kk') + '">ҚАЗ</button>';
    html += '<button type="button" data-action="setLang" data-lang="ru" class="nav-pill" style="' + langPillStyle('ru') + '">РУС</button>';

    html += '<div style="display:inline-flex; flex-direction:column; align-items:center; gap:14px">';
    html += '<h1 style="margin:0"><img src="logo.png" alt="BRATSKIY" style="width:112px; height:112px; border-radius:50%; box-shadow:0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(205,168,106,0.3)"></h1>';
    html += '<div style="display:flex; align-items:center; justify-content:center; gap:12px"><span style="width:28px; height:1px; background:' + ACCENT + '"></span><span style="font-family:\'Montserrat\',sans-serif; font-size:12px; letter-spacing:4px; color:' + ACCENT + '; font-weight:600">SHASHLYK · HALAL</span><span style="width:28px; height:1px; background:' + ACCENT + '"></span></div>';
    html += '</div>';

      html += '<div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px; text-align:center">';
      html += '<div style="width:44px; height:44px; border-radius:50%; border:1.5px solid ' + ACCENT + '; background:rgba(205,168,106,0.08); display:flex; align-items:center; justify-content:center; flex:0 0 auto">' + categoryIconHtml(cat.icon) + '</div>';
      html += '<h3 style="margin:0; font-family:\'Oswald\',sans-serif; font-weight:700; font-size:20px; letter-spacing:1px; text-transform:uppercase; color:#f3ead3">' + cat.title + '</h3>';

      html += '<div style="display:flex; flex-direction:column">';
      cat.items.forEach(function (item) {
        html += '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed rgba(205,168,106,0.16)">';

        html += '<span style="flex:0 0 auto; font-size:14.5px; font-weight:600; color:' + ACCENT + '; white-space:nowrap">' + item.priceText + '</span>';

      html += '</div></section>';
    });
    html += '</div>';

    // Sauces
    html += '<section id="sousy_chips" style="margin:0 0 46px 0; border:1.5px solid rgba(205,168,106,0.4); border-radius:18px; padding:26px 22px; background:rgba(255,255,255,0.02); scroll-margin-top:30px">';
    html += '<div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px; text-align:center">';

    // Sets
    html += '<section id="sets" style="margin:0 0 20px 0; scroll-margin-top:30px">';
    html += '<div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; text-align:center"><h3 style="margin:0; font-family:\'Oswald\',sans-serif; font-weight:800; font-size:28px; letter-spacing:1px; text-transform:uppercase; color:#f5f1e6">' + T('Сеттер', 'Сеты') + '</h3><span style="width:50px; height:1px; background:' + ACCENT + '"></span></div>';
    html += '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:18px">';
    sets.forEach(function (set) {
      html += '<div style="border:1.5px solid rgba(205,168,106,0.4); border-radius:18px; padding:22px; background:rgba(255,255,255,0.02); display:flex; flex-direction:column">';
      html += '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px"><h4 style="margin:0; font-family:\'Oswald\',sans-serif; font-weight:700; font-size:18px; letter-spacing:0.5px; text-transform:uppercase; color:#f3ead3">' + set.name + '</h4><span style="flex:0 0 auto; padding:5px 13px; border-radius:999px; border:1px solid ' + ACCENT + '; color:' + ACCENT + '; font-weight:700; font-size:13px; white-space:nowrap">' + set.priceText + '</span></div>';
      html += '<ul style="margin:0 0 16px; padding-left:18px; display:flex; flex-direction:column; gap:7px; flex:1 1 auto">';
      set.items.forEach(function (line) { html += '<li style="font-size:14px; color:#c9c2b4">' + line + '</li>'; });
      html += '</ul>';
      html += '<div style="display:flex; align-items:center; justify-content:flex-end; gap:7px; padding-top:12px; border-top:1px solid rgba(205,168,106,0.15)">' + stepperHtml(set.key, set.qty, true) + '</div>';
      html += '</div>';
    });
    html += '</div></section>';

    // Mini sets
    html += '<section id="mini_sets" style="margin:46px 0 20px 0; scroll-margin-top:30px">';
    html += '<div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; text-align:center"><h3 style="margin:0; font-family:\'Oswald\',sans-serif; font-weight:800; font-size:28px; letter-spacing:1px; text-transform:uppercase; color:#f5f1e6">' + T('Мини сеттер', 'Мини-сеты') + '</h3><span style="width:50px; height:1px; background:' + ACCENT + '"></span></div>';
    html += '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:18px">';
    miniSets.forEach(function (mset) {
      html += '<div style="border:1.5px solid rgba(205,168,106,0.4); border-radius:18px; padding:22px; background:rgba(255,255,255,0.02); display:flex; flex-direction:column">';
      html += '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px"><h4 style="margin:0; font-family:\'Oswald\',sans-serif; font-weight:700; font-size:18px; letter-spacing:0.5px; text-transform:uppercase; color:#f3ead3">' + mset.name + '</h4><span style="flex:0 0 auto; padding:5px 13px; border-radius:999px; border:1px solid ' + ACCENT + '; color:' + ACCENT + '; font-weight:700; font-size:13px; white-space:nowrap">' + mset.priceText + '</span></div>';
      html += '<ul style="margin:0 0 16px; padding-left:18px; display:flex; flex-direction:column; gap:7px; flex:1 1 auto">';
      mset.items.forEach(function (line) { html += '<li style="font-size:14px; color:#c9c2b4">' + line + '</li>'; });
      html += '</ul>';
      html += '<div style="display:flex; align-items:center; justify-content:flex-end; gap:7px; padding-top:12px; border-top:1px solid rgba(205,168,106,0.15)">' + stepperHtml(mset.key, mset.qty, true) + '</div>';
      html += '</div>';
    });
    html += '</div></section>';

    // Address
    html += '<section id="address" style="margin:46px 0 20px 0; border:1.5px solid rgba(205,168,106,0.4); border-radius:18px; padding:28px 24px; background:rgba(255,255,255,0.02); scroll-margin-top:30px">';
    html += '<div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; text-align:center"><h3 style="margin:0; font-family:\'Oswald\',sans-serif; font-weight:700; font-size:20px; letter-spacing:1px; text-transform:uppercase; color:#f3ead3">' + T('Мекен-жай', 'Адрес') + '</h3><span style="width:44px; height:1px; background:' + ACCENT + '"></span></div>';
    var gisLabel = T('2GIS-те ашу →', 'Открыть в 2GIS →');
    html += '<div style="display:flex; flex-direction:column; gap:16px">';
    html += '<div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border:1px solid rgba(205,168,106,0.25); border-radius:12px; background:rgba(255,255,255,0.02)"><span style="font-size:14.5px; color:#ece6da">' + T('Ақбақай көшесі, 2 / Садуақасов көшесі, 120', 'Улица Акбакай, 2 / улица Садвакасова, 120') + '</span><a href="https://2gis.kz/almaty/geo/70000001092855591/76.834781,43.220449" target="_blank" rel="noopener" style="flex:0 0 auto; padding:8px 16px; border-radius:999px; border:1px solid ' + ACCENT + '; color:' + ACCENT + '; font-size:13px; font-weight:600; white-space:nowrap">' + gisLabel + '</a></div>';
    html += '<div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border:1px solid rgba(205,168,106,0.25); border-radius:12px; background:rgba(255,255,255,0.02)"><span style="font-size:14.5px; color:#ece6da">' + T('Жұмабаев көшесі, 31 / Кабардин көшесі, 37', 'Улица Жумабаева, 31 / улица Кабардинская, 37') + '</span><a href="https://2gis.kz/almaty/geo/70000001117586790" target="_blank" rel="noopener" style="flex:0 0 auto; padding:8px 16px; border-radius:999px; border:1px solid ' + ACCENT + '; color:' + ACCENT + '; font-size:13px; font-weight:600; white-space:nowrap">' + gisLabel + '</a></div>';
    html += '</div></section>';

    // Rules
    html += '<section id="rules" style="margin:46px 0 20px 0; border:1.5px solid rgba(205,168,106,0.4); border-radius:18px; padding:28px 24px; background:rgba(255,255,255,0.02); scroll-margin-top:30px">';
    html += '<div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px; text-align:center"><h3 style="margin:0; font-family:\'Oswald\',sans-serif; font-weight:700; font-size:20px; letter-spacing:1px; text-transform:uppercase; color:#f3ead3">' + T('Мекеме ережелері', 'Правила заведения') + '</h3><span style="width:44px; height:1px; background:' + ACCENT + '"></span></div>';
    html += '<p style="margin:0 0 16px; font-size:14px; line-height:1.7; color:#cfc7b8">' + T('Bratskiy Shashlyk кафесіне кіре отырып, төменде көрсетілген ережелер мен шарттармен келісесіз. Аталған ережелер барлық келушілер үшін міндетті. Мекемеде тыйым салынады:', 'Заходя в кафе Bratskiy Shashlyk, вы соглашаетесь с указанными ниже правилами и условиями. Эти правила обязательны для всех посетителей. В заведении запрещается:') + '</p>';
    html += '<ul style="margin:0 0 16px; padding-left:20px; display:flex; flex-direction:column; gap:8px">';
    rules.forEach(function (r) { html += '<li style="font-size:14px; line-height:1.6; color:#cfc7b8">' + r + '</li>'; });
    html += '</ul>';
    html += '<p style="margin:0; font-size:13px; line-height:1.7; color:#a89f8f">' + T('Мекеме жеке заттар мен құнды бұйымдардың жоғалуы үшін жауапкершілік алмайды. Мекеме келушілері қоғамдық тәртіпті, сондай-ақ мекеме аумағында болу ережелері мен шарттарын бұзғаны үшін толық жауапкершілік алады.', 'Заведение не несёт ответственности за утерю личных вещей и ценностей. Посетители несут полную ответственность за нарушение общественного порядка, а также правил и условий пребывания на территории заведения.') + '</p>';
    html += '</section>';

    html += '</main>';

    // Footer
    html += '<footer style="text-align:center; padding:40px 20px 64px; border-top:1px solid rgba(205,168,106,0.15); margin-top:10px">';
    html += '<p style="font-size:13px; color:#a89f8f; margin:0 0 10px; letter-spacing:0.5px">' + T('Қызмет көрсету — 10%', 'Обслуживание — 10%') + '</p>';
    html += '<p style="font-family:\'Oswald\',sans-serif; font-size:18px; letter-spacing:0.5px; color:' + ACCENT + '; margin:0 0 18px">' + T('Асыңыз дәмді болсын, сізге жағымды және көтеріңкі көңіл күй тілейміз', 'Приятного аппетита, желаем вам хорошего и приподнятого настроения') + '</p>';
    html += '<p style="font-size:12px; color:#6b6355; margin:0; letter-spacing:1px">BRATSKIY SHASHLYK</p>';
    html += '</footer>';

    // Cart bar
    if (hasItems) {
      html += '<div style="position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(14,12,9,0.94); backdrop-filter:blur(6px); border-top:1px solid rgba(205,168,106,0.35); padding:14px 18px; display:flex; flex-direction:column; align-items:center; gap:10px">';
      if (state.cartOpen) {
        html += '<div style="width:100%; max-width:800px; max-height:160px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-bottom:4px; border-bottom:1px solid rgba(205,168,106,0.2)">';
        chosenItemsList.forEach(function (t) { html += '<div style="font-size:13px; color:#cfc7b8">' + t + '</div>'; });
        html += '</div>';
      }
      html += '<div style="width:100%; max-width:800px; display:flex; gap:10px">';
      html += '<button type="button" data-action="setDelivery" data-type="pickup" style="' + deliveryPillStyle('pickup') + '">' + T('Барып алу', 'Самовывоз') + '</button>';
      html += '<button type="button" data-action="setDelivery" data-type="delivery" style="' + deliveryPillStyle('delivery') + '">' + T('Жеткізу', 'Доставка') + '</button>';
      html += '</div>';
      html += '<div style="width:100%; max-width:800px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap">';
      html += '<button type="button" data-action="toggleCart" style="background:none; border:none; padding:0; cursor:pointer; display:flex; align-items:center; gap:8px; color:#ece6da; text-align:left"><div><div style="font-size:13px; color:#a89f8f; display:flex; align-items:center; gap:6px">' + T('Себетте: ', 'В корзине: ') + totalQty + T(' дана', ' шт') + '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#a89f8f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(' + (state.cartOpen ? '180deg' : '0deg') + '); transition:transform .15s ease"><path d="M5 9l7 7 7-7"></path></svg></div><div style="font-size:18px; font-weight:700; color:#f3ead3">' + fmtPrice(totalPrice) + '</div></div></button>';
      html += '<div style="display:flex; align-items:center; gap:14px">';
      html += '<button type="button" data-action="clearCart" style="background:none; border:none; padding:0; color:#a89f8f; font-size:13px; text-decoration:underline; cursor:pointer">' + T('Себетті тазалау', 'Очистить корзину') + '</button>';
      html += '<a href="' + orderLink + '" target="_blank" rel="noopener" style="text-decoration:none; padding:13px 26px; border-radius:999px; background:' + ACCENT + '; color:#1a1408; font-weight:700; font-size:15px; white-space:nowrap">' + T('Тапсырыс беру →', 'Оформить заказ →') + '</a>';
      html += '</div></div></div>';
    }

    html += '</div>';

    document.getElementById('app').innerHTML = html;
  }

  document.getElementById('app').addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    if (action === 'setLang') { state.lang = el.getAttribute('data-lang'); render(); }
    else if (action === 'navClick') { state.activeNav = el.getAttribute('data-id'); render(); }
    else if (action === 'inc') { incKey(el.getAttribute('data-key')); }
    else if (action === 'dec') { e.preventDefault(); decKey(el.getAttribute('data-key')); }
    else if (action === 'sauceToggle') {
      var key = el.getAttribute('data-key');
      var s = Object.assign({}, state.sauceSel);
      s[key] = !s[key];
      state.sauceSel = s;
      render();
    }
    else if (action === 'setDelivery') { state.deliveryType = el.getAttribute('data-type'); render(); }
    else if (action === 'toggleCart') { state.cartOpen = !state.cartOpen; render(); }
    else if (action === 'clearCart') { state.cart = {}; state.sauceSel = {}; render(); }
  });

  render();
})();
</script>
</body>
</html>
